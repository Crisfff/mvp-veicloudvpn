<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <meta name="description" content="VeiCloud login" />
  <title>VeiCloud · Login</title>
  <link rel="icon" href="favicon.svg?v=4" type="image/svg+xml" />
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="stylesheet" href="styles.css?v=10" />
</head>
<body>
  <main class="login-page">
    <div class="background-image" aria-hidden="true"></div>
    <div class="blur-transition" aria-hidden="true"></div>
    <div class="dark-fade" aria-hidden="true"></div>

    <section class="auth-shell" aria-label="Inicio de sesión">
      <div class="brand-block">
        <div class="brand-icon"><i data-lucide="cloud"></i></div>
        <h1>VeiCloud</h1>
      </div>

      <div class="auth-options" id="authOptions">
        <button class="auth-button google-button" type="button" id="googleButton">
          <i class="fa-brands fa-google" aria-hidden="true"></i>
          <span>Continuar con Google</span>
        </button>

        <button class="auth-button email-button" type="button" id="showEmailForm">
          <i data-lucide="mail"></i>
          <span>Continuar con correo</span>
        </button>
      </div>

      <form class="email-form" id="emailForm" hidden>
        <div class="form-heading">
          <button class="back-button" type="button" id="backToOptions" aria-label="Volver">
            <i data-lucide="arrow-left"></i>
          </button>
          <span>Iniciar sesión</span>
        </div>

        <label class="field">
          <span>Correo</span>
          <div class="input-wrap">
            <i data-lucide="mail"></i>
            <input type="email" name="email" autocomplete="email" placeholder="correo@ejemplo.com" required />
          </div>
        </label>

        <label class="field">
          <span>Contraseña</span>
          <div class="input-wrap">
            <i data-lucide="lock-keyhole"></i>
            <input id="password" type="password" name="password" autocomplete="current-password" placeholder="••••••••" minlength="6" required />
            <button class="eye-button" id="togglePassword" type="button" aria-label="Mostrar contraseña">
              <i data-lucide="eye"></i>
            </button>
          </div>
        </label>

        <button class="submit-button" type="submit">
          <span>Entrar</span>
          <i data-lucide="arrow-right"></i>
        </button>

        <button class="forgot-button" type="button" id="forgotButton">¿Olvidaste tu contraseña?</button>
      </form>

      <div class="legal-links">
        <button type="button" class="legal-link">Política de privacidad</button>
        <button type="button" class="legal-link">Términos de servicio</button>
      </div>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite">
      <i data-lucide="info"></i>
      <span></span>
    </div>
  </main>

  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="app.js?v=10"></script>
</body>
</html>
