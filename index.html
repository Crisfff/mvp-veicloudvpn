<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#111111" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111111" />
  <meta name="description" content="VeiCloud login" />
  <title>VeiCloud · Login</title>
  <link rel="icon" href="favicon.svg?v=4" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="stylesheet" href="styles-v25.css" />
</head>
<body>
  <main class="login-page">
    <div class="safari-top-tint" aria-hidden="true"></div>
    <div class="signup-header">
      <span>¿No tienes cuenta?</span>
      <button type="button" class="create-account-top" id="createAccountTop">Crear una cuenta</button>
    </div>
    <div class="background-image" aria-hidden="true"></div>
    <div class="blur-transition" aria-hidden="true"></div>
    <div class="dark-fade" aria-hidden="true"></div>

    <section class="auth-shell" aria-label="Inicio de sesión">
      <div class="brand-block">
        <div class="brand-icon"><img src="assets/veicloud-logo.webp?v=2" alt="VeiCloud" class="brand-logo" /></div>
        <h1>VeiCloud</h1>
      </div>

      <div class="auth-options" id="authOptions">
        <button class="auth-button google-button" type="button" id="googleButton">
          <iconify-icon icon="logos:google-icon" class="google-icon" aria-hidden="true"></iconify-icon>
          <span>Continuar con Google</span>
        </button>

        <button class="auth-button email-button" type="button" id="showEmailForm">
          <span>Continuar con correo</span>
        </button>
      </div>

      <form class="email-form" id="emailForm" hidden>
        <div class="form-heading">
          <button class="back-button" type="button" id="backToOptions" aria-label="Volver">
            <i data-lucide="arrow-left"></i>
          </button>
          <span>Iniciar sesión</span>
        </div>

        <label class="field">
          <span>Correo</span>
          <div class="input-wrap">
            <i data-lucide="mail"></i>
            <input type="email" name="email" autocomplete="email" placeholder="correo@ejemplo.com" required />
          </div>
        </label>

        <label class="field">
          <span>Contraseña</span>
          <div class="input-wrap">
            <i data-lucide="lock-keyhole"></i>
            <input id="password" type="password" name="password" autocomplete="current-password" placeholder="••••••••" minlength="6" required />
            <button class="eye-button" id="togglePassword" type="button" aria-label="Mostrar contraseña">
              <i data-lucide="eye"></i>
            </button>
          </div>
        </label>

        <button class="submit-button" type="submit">
          <span>Entrar</span>
          <i data-lucide="arrow-right"></i>
        </button>

        <button class="forgot-button" type="button" id="forgotButton">¿Olvidaste tu contraseña?</button>
      </form>

      <div class="legal-links">
        <button type="button" class="legal-link">Política de privacidad</button>
        <button type="button" class="legal-link">Términos de servicio</button>
      </div>
    </section>

    <div class="mobile-email-sheet" id="mobileEmailSheet" aria-hidden="true">
      <div class="mobile-sheet-backdrop" id="mobileSheetBackdrop"></div>

      <section class="mobile-sheet-panel" role="dialog" aria-modal="true" aria-labelledby="mobileSheetTitle">
        <div class="sheet-handle" aria-hidden="true"></div>

        <div class="sheet-header">
          <h2 id="mobileSheetTitle">Iniciar sesión</h2>
          <button class="sheet-close" id="mobileSheetClose" type="button" aria-label="Cerrar">
            <i data-lucide="x"></i>
          </button>
        </div>

        <form class="mobile-sheet-form" id="mobileEmailForm">
          <label class="mobile-input-card">
            <input type="email" name="mobileEmail" autocomplete="email" placeholder="Correo electrónico" required />
          </label>

          <label class="mobile-input-card password-card">
            <input id="mobilePassword" type="password" name="mobilePassword" autocomplete="current-password" placeholder="Contraseña" minlength="6" required />
            <button class="mobile-eye-button" id="mobileTogglePassword" type="button" aria-label="Mostrar contraseña">
              <i data-lucide="eye"></i>
            </button>
          </label>

          <button class="mobile-login-submit" type="submit">Iniciar sesión</button>
        </form>
      </section>
    </div>

    <div class="mobile-email-sheet" id="mobileSignupSheet" aria-hidden="true">
      <div class="mobile-sheet-backdrop" id="mobileSignupBackdrop"></div>

      <section class="mobile-sheet-panel" role="dialog" aria-modal="true" aria-labelledby="mobileSignupTitle">
        <div class="sheet-handle" aria-hidden="true"></div>

        <div class="sheet-header">
          <h2 id="mobileSignupTitle">Crear cuenta</h2>
          <button class="sheet-close" id="mobileSignupClose" type="button" aria-label="Cerrar">
            <i data-lucide="x"></i>
          </button>
        </div>

        <form class="mobile-sheet-form" id="mobileSignupForm">
          <label class="mobile-input-card">
            <input type="email" name="mobileSignupEmail" autocomplete="email" placeholder="Correo electrónico" required />
          </label>

          <label class="mobile-input-card password-card">
            <input id="mobileSignupPassword" type="password" name="mobileSignupPassword" autocomplete="new-password" placeholder="Contraseña" minlength="6" required />
            <button class="mobile-eye-button" id="mobileToggleSignupPassword" type="button" aria-label="Mostrar contraseña">
              <i data-lucide="eye"></i>
            </button>
          </label>

          <label class="mobile-input-card password-card">
            <input id="mobileSignupRepeatPassword" type="password" name="mobileSignupRepeatPassword" autocomplete="new-password" placeholder="Repetir contraseña" minlength="6" required />
            <button class="mobile-eye-button" id="mobileToggleSignupRepeatPassword" type="button" aria-label="Mostrar contraseña">
              <i data-lucide="eye"></i>
            </button>
          </label>

          <button class="mobile-login-submit" type="submit">Crear cuenta</button>

          <div class="mobile-sheet-divider"><span>o</span></div>

          <button class="mobile-google-signup" id="mobileGoogleSignup" type="button">
            <iconify-icon icon="logos:google-icon" class="google-icon" aria-hidden="true"></iconify-icon>
            <span>Crear cuenta con Google</span>
          </button>
        </form>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite">
      <i data-lucide="info"></i>
      <span></span>
    </div>
  </main>

  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="app-v23.js"></script>
</body>
</html>
